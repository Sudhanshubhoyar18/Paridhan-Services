services:
  - type: web
    name: paridhan-uniforms
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm run setup && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
